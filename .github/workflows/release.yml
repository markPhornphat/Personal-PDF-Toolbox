name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-toolbox-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PDF_TOOLBOX_RELEASE_REPOSITORY: ${{ vars.PDF_TOOLBOX_RELEASE_REPOSITORY || github.repository }}
      PDF_TOOLBOX_SOURCE_REPOSITORY: ${{ github.repository }}
      PDF_TOOLBOX_RELEASE_PRIVATE: ${{ vars.PDF_TOOLBOX_RELEASE_PRIVATE || 'true' }}
      PDF_TOOLBOX_UPDATE_PUBLIC_KEY: ${{ vars.PDF_TOOLBOX_UPDATE_PUBLIC_KEY }}
      PDF_TOOLBOX_REQUIRE_AUTHENTICODE: ${{ vars.PDF_TOOLBOX_REQUIRE_AUTHENTICODE }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: ./scripts/install-compiler.ps1
      - run: ./scripts/build.ps1
      - run: ./scripts/smoke-install.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-offline-installer
          path: |
            dist/PDF-Toolbox-Setup-x64.exe
            dist/SHA256SUMS.txt
            dist/release-build.json
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && vars.PDF_TOOLBOX_PUBLISH == 'true'
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      PDF_TOOLBOX_RELEASE_REPOSITORY: ${{ vars.PDF_TOOLBOX_RELEASE_REPOSITORY || github.repository }}
      PDF_TOOLBOX_SOURCE_REPOSITORY: ${{ github.repository }}
      PDF_TOOLBOX_RELEASE_PRIVATE: ${{ vars.PDF_TOOLBOX_RELEASE_PRIVATE || 'true' }}
      PDF_TOOLBOX_UPDATE_PUBLIC_KEY: ${{ vars.PDF_TOOLBOX_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - name: Retrieve verified package
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_TOOLBOX_RUN_ID: ${{ github.run_id }}
        run: gh run download $env:PDF_TOOLBOX_RUN_ID -n windows-offline-installer -D release-assets
      - name: Validate version and publish
        env:
          GH_TOKEN: ${{ secrets.PDF_TOOLBOX_RELEASE_TOKEN || github.token }}
          PDF_TOOLBOX_SIGNING_KEY: ${{ secrets.PDF_TOOLBOX_SIGNING_KEY }}
        run: ./scripts/publish-release.ps1
