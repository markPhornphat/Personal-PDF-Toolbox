[project]
name = "pdf-toolbox"
version = "0.3.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials==6.10.2",
    "pypdf==6.9.2",
    "pypdfium2==5.15.2",
    "Pillow==12.2.0",
    "cryptography==47.0.0",
    "pywin32-ctypes==0.2.3",
    "pywin32==311",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
    "ruff==0.15.7",
    "mypy==1.19.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
